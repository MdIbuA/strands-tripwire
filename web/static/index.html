<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripwire Arena</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #121722; --line: #222a3a; --text: #e6e9ef; --dim: #8a93a6;
    --red: #ff5c5c; --green: #3ddc97; --amber: #ffb547; --blue: #6aa8ff;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--amber); }
  .sub { color: var(--dim); font-size: 13px; }
  select, button { font: inherit; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  button.go { background: var(--amber); color: #111; border: 0; font-weight: 600; cursor: pointer; }
  .prompt { margin: 16px 24px 0; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .prompt b { color: var(--blue); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px 32px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 420px; display: flex; flex-direction: column; overflow: hidden; }
  .col h2 { margin: 0; padding: 12px 16px; font-size: 15px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .col.unprot h2 { color: var(--red); } .col.prot h2 { color: var(--green); }
  .feed { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
  .ev { border-left: 3px solid var(--line); padding: 6px 10px; background: #0f131c; border-radius: 0 6px 6px 0; animation: in .25s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .ev .k { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); }
  .ev code { font-family: var(--mono); font-size: 12.5px; word-break: break-word; }
  .ev.proposed { border-color: var(--blue); }
  .ev.exec { border-color: var(--red); background: #1d0f12; }
  .ev.exec.safe { border-color: var(--green); background: #0e1a15; }
  .ev.deny { border-color: var(--red); } .ev.guide, .ev.confirm { border-color: var(--amber); } .ev.proceed { border-color: var(--green); }
  .ev.quar { border-color: var(--red); }
  .bars { display: grid; grid-template-columns: 96px 1fr 42px; gap: 4px 8px; align-items: center; margin-top: 6px; font-family: var(--mono); font-size: 12px; }
  .bar { height: 8px; background: #1b2232; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; transition: width .5s ease; }
  .verdict { font-weight: 700; font-family: var(--mono); }
  .lat { color: var(--amber); font-family: var(--mono); font-size: 12px; }
  .final { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13.5px; white-space: pre-wrap; color: var(--dim); max-height: 220px; overflow: auto; }
  .banner { padding: 10px 16px; font-weight: 700; text-align: center; letter-spacing: .5px; }
  .banner.bad { background: var(--red); color: #fff; } .banner.good { background: var(--green); color: #062; }
  .confirm-box button { margin: 6px 6px 0 0; cursor: pointer; }
  .stats { color: var(--dim); font-size: 12px; font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <h1>Trip<span>wire</span> Arena</h1>
  <div class="sub">Same agent, same model, same attack. One side has a 2B decision model checking who actually asked.</div>
  <div style="flex:1"></div>
  <select id="sc"></select>
  <button class="go" id="go">Run both</button>
</header>
<div class="prompt" id="prompt"></div>
<div class="grid">
  <section class="col unprot"><h2>Unprotected agent <span class="stats" id="s-none"></span></h2><div class="feed" id="f-none"></div><div id="b-none"></div><div class="final" id="t-none"></div></section>
  <section class="col prot"><h2>Agent + Tripwire (Strands Decider 2B) <span class="stats" id="s-tripwire"></span></h2><div class="feed" id="f-tripwire"></div><div id="b-tripwire"></div><div class="final" id="t-tripwire"></div></section>
</div>
<script>
const $ = id => document.getElementById(id);
let scenarios = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const color = p => p >= .9 ? "var(--green)" : p >= .5 ? "var(--amber)" : "var(--red)";

fetch("/api/scenarios").then(r => r.json()).then(d => {
  scenarios = d.scenarios;
  $("sc").innerHTML = scenarios.map(s => `<option value="${s.id}">${s.kind === "attack" ? "⚠ " : "✓ "}${esc(s.title)}</option>`).join("");
  showPrompt();
});
$("sc").onchange = showPrompt;
function showPrompt() {
  const s = scenarios.find(x => x.id === $("sc").value);
  $("prompt").innerHTML = `<b>USER:</b> ${esc(s.prompt)} ${s.blurb ? `<div class="sub" style="margin-top:4px">${esc(s.blurb)}</div>` : ""}`;
}

function bars(rows) {
  return `<div class="bars">${rows.map(([k, v, c]) => `<span>${k}</span><div class="bar"><i style="background:${c || color(v)}" data-w="${(v*100).toFixed(0)}%"></i></div><span>${v.toFixed(2)}</span>`).join("")}</div>`;
}
function add(mode, cls, html) {
  const el = document.createElement("div");
  el.className = "ev " + cls; el.innerHTML = html; $("f-" + mode).appendChild(el);
  requestAnimationFrame(() => el.querySelectorAll("i[data-w]").forEach(i => i.style.width = i.dataset.w));
  el.scrollIntoView({ block: "nearest" });
}

function run(mode, id) {
  ["f-", "b-", "t-", "s-"].forEach(p => $(p + mode).innerHTML = "");
  let decisions = 0, ms = 0;
  const es = new EventSource(`/api/run/${id}/${mode}`);
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.kind === "tool_proposed") add(mode, "proposed", `<div class="k">agent proposes</div><code>${esc(d.tool)}(${esc(JSON.stringify(d.args))})</code>`);
    else if (d.kind === "chunk_verdict") {
      decisions++; ms += d.latency_ms;
      add(mode, d.quarantined ? "quar" : "", `<div class="k">decider · context quarantine · chunk ${d.index} <span class="lat">${d.latency_ms.toFixed(0)} ms</span></div>
        <code>${esc(d.preview.slice(0, 110))}…</code>${bars([["injection", d.injection, d.quarantined ? "var(--red)" : "var(--green)"]])}
        <div class="verdict" style="color:${d.quarantined ? "var(--red)" : "var(--green)"}">${d.quarantined ? "QUARANTINED: never reaches the LLM" : "clean"}</div>`);
    }
    else if (d.kind === "guard_decision" || d.kind === "confirm_request") {
      decisions += d.kind === "guard_decision" ? 1 : 0; ms += d.kind === "guard_decision" ? d.latency_ms : 0;
      const v = d.kind === "confirm_request" ? "confirm" : d.verdict;
      const cls = { proceed: "proceed", approved: "proceed", deny: "deny", rejected: "deny", guide: "guide", confirm: "confirm" }[v];
      const vc = { proceed: "var(--green)", approved: "var(--green)", deny: "var(--red)", rejected: "var(--red)" }[v] || "var(--amber)";
      let html = `<div class="k">decider · provenance guard · ${esc(d.tool)} <span class="lat">${d.latency_ms.toFixed(0)} ms</span></div>
        <code>${esc(d.tool)}(${esc(JSON.stringify(d.args))})</code>
        ${bars([["user asked?", d.asked]])}
        <div class="verdict" style="color:${vc}">${v.toUpperCase()}: <span style="font-weight:400">${esc(d.reason)}</span></div>`;
      if (d.kind === "confirm_request") html += `<div class="confirm-box">Approve <code>${esc(d.tool)}(${esc(JSON.stringify(d.args))})</code>?<br>
        <button onclick="answer('${d.run_id}','yes',this)">Approve</button><button onclick="answer('${d.run_id}','no',this)">Reject</button></div>`;
      add(mode, cls, html);
    }
    else if (d.kind === "side_effect") {
      const s = scenarios.find(x => x.id === id);
      add(mode, "exec" + (s.kind === "benign" ? " safe" : ""), `<div class="k">executed</div><code>${esc(d.action)} → ${esc(d.recipients.join(", "))}${d.file ? " · " + esc(d.file) : ""}</code>`);
    }
    else if (d.kind === "done") {
      $("t-" + mode).textContent = d.final_text.trim();
      $("b-" + mode).innerHTML = d.scenario_kind === "attack"
        ? `<div class="banner ${d.attack_succeeded ? "bad" : "good"}">${d.attack_succeeded ? "ATTACK SUCCEEDED: DATA LEFT THE BUILDING" : "ATTACK BLOCKED"}</div>`
        : `<div class="banner ${d.task_completed ? "good" : "bad"}">${d.task_completed ? "TASK COMPLETED" : "TASK NOT COMPLETED"}</div>`;
      if (decisions) $("s-" + mode).textContent = `${decisions} decisions · avg ${(ms / decisions).toFixed(0)} ms`;
      es.close();
    }
    else if (d.kind === "error") { add(mode, "deny", `<div class="k">error</div><code>${esc(d.message)}</code>`); es.close(); }
  };
}
function answer(runId, a, btn) {
  fetch(`/api/confirm/${runId}/${a}`, { method: "POST" });
  btn.parentElement.innerHTML = `<span class="verdict">${a === "yes" ? "APPROVED by human" : "REJECTED by human"}</span>`;
}
$("go").onclick = () => { const id = $("sc").value; run("none", id); run("tripwire", id); };
</script>
</body>
</html>
